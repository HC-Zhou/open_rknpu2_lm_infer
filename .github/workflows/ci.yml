name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ARM64 build and checks
    runs-on: ubuntu-24.04-arm
    container: debian:bullseye
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Install build tools
        run: |
          cat > /etc/apt/sources.list <<'EOF'
          deb http://archive.debian.org/debian bullseye main
          deb http://archive.debian.org/debian-security bullseye-security main
          EOF
          apt-get update
          apt-get install --no-install-recommends -y \
            build-essential ca-certificates cmake curl git libclang-dev pkg-config python3
      - uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false
      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: arm64-bullseye-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --release --locked -- -D warnings
      - name: Tests
        run: cargo test --release --locked
      - name: Release build
        run: cargo build --release --locked
      - name: CLI smoke test
        run: |
          target/release/open_rknpu2_lm_infer --version
          target/release/open_rknpu2_lm_infer --help
      - name: Package
        run: python3 scripts/package_release.py --output dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
