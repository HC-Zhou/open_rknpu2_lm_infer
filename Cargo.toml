[package]
name = "open_rknpu2_lm_infer"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Rust LLM inference on RK3588 using the open RKNPU2 driver"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
tokio-stream = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.29"
crossterm = "0.28"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
minijinja = { version = "2", features = ["builtins", "json", "loop_controls"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
memmap2 = "0.9"
safetensors = "0.6"
half = "2"
rand = "0.8"
rand_chacha = "0.3"
libc = "0.2"
rayon = "1"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
bindgen = "0.71"
cmake = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
